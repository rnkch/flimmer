name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # flimmerkiste needs mpv 0.38 or newer (loadfile's index argument). Ubuntu's own
    # mpv is older; Debian 13 has 0.40, the same as Raspberry Pi OS.
    container: debian:trixie
    steps:
      # The tests start a real mpv (no window: --vo=null) and encode with
      # ffmpeg's libx264.
      - run: apt-get update && apt-get install -y git ca-certificates mpv ffmpeg
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: mpv --version | head -1 && ffmpeg -version | head -1
      # Line length: golines at 100 columns (generated code is skipped).
      - name: Format check
        working-directory: go
        run: |
          go install github.com/segmentio/golines@v0.15.0
          files=$("$(go env GOPATH)/bin/golines" -l --ignore-generated -m 100 .)
          if [ -n "$files" ]; then
            echo "Not formatted; run: cd go && golines -w --ignore-generated -m 100 ."
            echo "$files"
            exit 1
          fi
      - working-directory: go
        run: go vet ./... && go test ./...
