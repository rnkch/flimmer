# Pushing a tag like v0.2.0 builds flimmer and publishes a GitHub release:
# one binary per platform plus checksums.txt. Installed flimmers pick that up
# with /upgrade in Telegram or the System page (internal/kiosk/upgrade.go).
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# A tag with a suffix (v0.2.0-rc1) becomes a pre-release; flimmer's upgrade
# only follows full releases.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Build
        working-directory: go
        run: |
          set -euo pipefail
          mkdir ../dist
          for arch in arm64 amd64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X github.com/rnkch/flimmer/internal/kiosk.releaseVersion=${GITHUB_REF_NAME}" \
              -o ../dist/flimmer-linux-$arch ./cmd/flimmer
          done
          cd ../dist
          # The amd64 build runs on this runner: it must report the tag, as
          # flimmer's upgrade expects of a downloaded binary.
          test "$(./flimmer-linux-amd64 -version)" = "${GITHUB_REF_NAME}"
          sha256sum flimmer-linux-* > checksums.txt
          cat checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/flimmer-linux-arm64 dist/flimmer-linux-amd64 dist/checksums.txt \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $flags
