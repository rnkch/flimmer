# Installed by deploy.sh as /etc/systemd/journald.conf.d/50-flimmer.conf.
# Raspberry Pi OS keeps the journal in RAM only (Storage=volatile), so the
# log was lost on every reboot - exactly when it's needed. Keep it on the SD
# card instead, capped at 50 MB: journald deletes the oldest entries.
[Journal]
Storage=persistent
SystemMaxUse=50M
