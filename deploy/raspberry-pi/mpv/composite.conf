vo=gpu
gpu-api=opengl
gpu-dumb-mode=yes
hwdec=v4l2m2m-copy
audio-device=alsa/plughw:CARD=Headphones,DEV=0
keep-open=yes
terminal=yes
idle=yes

# Correct geometry for PAL TV
monitorpixelaspect=1.0940

# Ensure the video scales to fit the window while keeping correct aspect
keepaspect=yes
keepaspect-window=yes
