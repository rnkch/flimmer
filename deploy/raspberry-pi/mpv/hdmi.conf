vo=gpu
gpu-api=opengl
profile=fast
hwdec=v4l2m2m-copy
opengl-glfinish=yes
audio-device=alsa/plughw:CARD=Headphones,DEV=0
keep-open=yes
terminal=yes
idle=yes

# Square pixels for HDMI
monitorpixelaspect=1.0

# Full HD window
autofit=1920x1080

# Ensure the video scales to fit the window while keeping correct aspect
keepaspect=yes
keepaspect-window=yes
